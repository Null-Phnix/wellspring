[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellspring"
version = "0.1.0"
description = "Source-linked Alberta ST1 well licence event explorer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
wellspring = "wellspring.ingest.cli:main"

[tool.setuptools.packages.find]
include = ["wellspring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
